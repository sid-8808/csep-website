        <a href="index.html#pillars" style="color: #FFFFFF; text-decoration: none; padding: 10px 0;">Coaching</a>
        <a href="index.html#coe" style="color: #FFFFFF; text-decoration: none; padding: 10px 0;">Centre of Excellence</a>
        <a href="index.html#news" style="color: #FFFFFF; text-decoration: none; padding: 10px 0;">News</a>
        <a href="clinics.html" style="background: #1EA0DC; color: #0E1748; text-decoration: none; padding: 12px 22px; border-radius: 2px;">Register</a>
      </div>
    </nav>
  </header>

  <!-- page hero -->
  <section class="diag" style="background: #0E1748; color: #FFFFFF;">
    <div style="max-width: 1320px; margin: 0 auto; padding: 72px 24px 56px; display: flex; flex-direction: column; gap: 12px;">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; letter-spacing: .2em; color: #1EA0DC; font-size: 15px;">COMPETITION</span>
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: clamp(52px, 7vw, 96px); line-height: .92; text-transform: uppercase;">Competition calendar 2026–27</h1>
      <p style="margin: 0; font-size: 18px; color: #D5DBF2; max-width: 640px; line-height: 1.55;">SRFI-ranked events across Gujarat. Entries, draws and results for every Chiripal tournament in one place.</p>
    </div>
  </section>

  <!-- season stats -->
  <section style="background: #14215C; color: #FFFFFF; border-top: 4px solid #1EA0DC;">
    <div style="max-width: 1320px; margin: 0 auto; padding: 32px 24px; display: flex; flex-direction: column; gap: 16px;">

        <div style="display: flex; flex-direction: column; gap: 2px;"><span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 48px; line-height: 1; color: #1EA0DC;">5</span><span style="font-size: 13px; font-weight: 700; letter-spacing: .1em;">TOURNAMENTS HOSTED</span></div>
        <div style="display: flex; flex-direction: column; gap: 2px;"><span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 48px; line-height: 1; color: #1EA0DC;">1,073+</span><span style="font-size: 13px; font-weight: 700; letter-spacing: .1em;">PLAYERS PARTICIPATED</span></div>
        <div style="display: flex; flex-direction: column; gap: 2px;"><span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 48px; line-height: 1; color: #1EA0DC;">19+</span><span style="font-size: 13px; font-weight: 700; letter-spacing: .1em;">STATES REPRESENTED</span></div>
        <div style="display: flex; flex-direction: column; gap: 2px;"><span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 48px; line-height: 1; color: #1EA0DC;">+44%</span><span style="font-size: 13px; font-weight: 700; letter-spacing: .1em;">PARTICIPATION GROWTH*</span></div>
      </div>
      <span style="font-size: 12px; color: #C9CFE6;">*Gujarat State Closed Championship, Aug 2025 vs previous season. Female participation up 78.5%.</span>
    </div>
  </section>

  <!-- filters -->
  <div style="border-bottom: 1px solid #DDE2F0; background: #F7F8FC;">
    <div style="max-width: 1320px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between;">
      <div role="tablist" aria-label="Filter events" style="display: flex; gap: 4px; flex-wrap: wrap;">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
          <button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
        </sc-for>
      </div>
      <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
        <label for="city" style="font-size: 14px; font-weight: 700; color: #4A4F63;">City</label>
        <select id="city" style="height: 44px; padding: 0 12px; border: 1px solid #B9C1DA; background: #FFFFFF; font-size: 15px; font-family: inherit;">

        </select>
        <a href="#" style="font-weight: 700; font-size: 15px;">Add to calendar (.ics)</a>
      </div>
    </div>
  </div>

  <!-- event list -->
  <section>
    <div style="max-width: 1320px; margin: 0 auto; padding: 40px 24px 72px; display: flex; flex-direction: column; gap: 12px;">
      <sc-for list="{{events}}" as="e" hint-placeholder-count="5">
        <article style="display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: center; border: 1px solid #DDE2F0; border-left: 0; padding: 0; background: #FFFFFF;">
          <div style="{{e.dateStyle}}">
            <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 34px; line-height: 1;">{{e.day}}</span>
            <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: .1em;">{{e.month}}</span>
          </div>
          <div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 6px; padding: 16px 0;">
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
              <span style="background: #14215C; color: #FFFFFF; font-size: 12px; font-weight: 700; letter-spacing: .1em; padding: 3px 8px;">{{e.tier}}</span>
              <span style="background: #EEF1FA; color: #14215C; font-size: 12px; font-weight: 700; letter-spacing: .1em; padding: 3px 8px;">{{e.status}}</span>
            </div>
            <h2 style="margin: 0; font-size: 22px; line-height: 1.25;">{{e.name}}</h2>
            <span style="color: #4A4F63; font-size: 15px;">{{e.where}}</span>
          </div>
          <div style="flex: 0 1 200px; display: flex; flex-direction: column; gap: 2px; padding: 0 0 0 0;">
            <span style="font-size: 12px; font-weight: 700; letter-spacing: .1em; color: #4A4F63;">{{e.statLabel}}</span>

          </div>
          <div style="padding: 16px 24px 16px 0;">
            <a href="#detail" onClick="{{e.open}}" style="display: inline-block; background: #143CAA; color: #FFFFFF; text-decoration: none; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px; letter-spacing: .06em; text-transform: uppercase; padding: 12px 22px;">{{e.cta}}</a>
          </div>
        </article>

        <p style="margin: 0; padding: 32px; text-align: center; color: #4A4F63; border: 1px dashed #B9C1DA;">No events in this view yet.</p>
      </sc-if>
    </div>

            </sc-for>
          </div>
          <p style="margin: 0; max-width: 820px; color: #D5DBF2; line-height: 1.6;">{{sel.summary}}</p>
        </div>
      </sc-if>

      <sc-if value="{{showEntries}}" hint-placeholder-val="{{ false }}">
        <div style="background: #14215C; padding: 28px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between;">

        </div>
      </sc-if>

      <sc-if value="{{showDraws}}" hint-placeholder-val="{{ false }}">
        <div style="overflow-x: auto; background: #14215C; padding: 24px;">
          <div style="display: flex; gap: 32px; min-width: 760px;">
            <div style="display: flex; flex-direction: column; gap: 12px; flex: 1;">
              <span style="font-size: 12px; font-weight: 700; letter-spacing: .1em; color: #1EA0DC;">QUARTER-FINALS</span>
              <div style="background: #0E1748; padding: 10px 14px;">[PLAYER 1] <b style="float: right;">3</b><br>[PLAYER 8] <span style="float: right;">1</span></div>
              <div style="background: #0E1748; padding: 10px 14px;">[PLAYER 4] <b style="float: right;">3</b><br>[PLAYER 5] <span style="float: right;">2</span></div>
              <div style="background: #0E1748; padding: 10px 14px;">[PLAYER 3] <b style="float: right;">3</b><br>[PLAYER 6] <span style="float: right;">0</span></div>
              <div style="background: #0E1748; padding: 10px 14px;">[PLAYER 2] <b style="float: right;">3</b><br>[PLAYER 7] <span style="float: right;">1</span></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 12px; flex: 1; justify-content: space-around;">
              <span style="font-size: 12px; font-weight: 700; letter-spacing: .1em; color: #1EA0DC;">SEMI-FINALS</span>
              <div style="background: #0E1748; padding: 10px 14px;">[PLAYER 1] <b style="float: right;">3</b><br>[PLAYER 4] <span style="float: right;">2</span></div>
              <div style="background: #0E1748; padding: 10px 14px;">[PLAYER 3] <span style="float: right;">1</span><br>[PLAYER 2] <b style="float: right;">3</b></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 12px; flex: 1; justify-content: center;">
              <span style="font-size: 12px; font-weight: 700; letter-spacing: .1em; color: #1EA0DC;">FINAL</span>
              <div style="background: #143CAA; padding: 10px 14px;">[PLAYER 1] <b style="float: right;">3</b><br>[PLAYER 2] <span style="float: right;">2</span></div>
            </div>
          </div>
        </div>
      </sc-if>

      <sc-if value="{{showResults}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; gap: 28px;">
          <sc-if value="{{sel.noResults}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 24px; background: #14215C; color: #D5DBF2;">Results will be published here after the event.</p></sc-if>
          <sc-if value="{{sel.teamResults}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 10px;"><h3 style="margin: 0; font-size: 14px; letter-spacing: .12em; color: #1EA0DC;">TEAM EVENTS</h3><div style="overflow-x: auto;"><table style="width: 100%; min-width: 600px; border-collapse: collapse; font-size: 15px;"><thead><tr style="color: #C9CFE6; font-size: 12px; letter-spacing: .1em;"><th style="padding: 12px; text-align: left;">CATEGORY</th><th style="padding: 12px; text-align: left;">FIRST</th><th style="padding: 12px; text-align: left;">SECOND</th><th style="padding: 12px; text-align: left;">THIRD</th></tr></thead><tbody><sc-for list="{{sel.teamResults}}" as="r" hint-placeholder-count="6"><tr style="border-top: 1px solid rgba(255,255,255,.15);"><td style="padding: 12px;">{{r.c}}</td><td style="padding: 12px; font-weight: 700;">{{r.a}}</td><td style="padding: 12px;">{{r.b}}</td><td style="padding: 12px;">{{r.d}}</td></tr></sc-for></tbody></table></div></div></sc-if>
          <sc-if value="{{sel.results}}" hint-placeholder-val="{{ true }}"><div style="display: flex; flex-direction: column; gap: 10px;"><h3 style="margin: 0; font-size: 14px; letter-spacing: .12em; color: #1EA0DC;">{{sel.resultsTitle}}</h3><div style="overflow-x: auto;"><table style="width: 100%; min-width: 600px; border-collapse: collapse; font-size: 15px;"><thead><tr style="color: #C9CFE6; font-size: 12px; letter-spacing: .1em;"><th style="padding: 12px; text-align: left;">CATEGORY</th><th style="padding: 12px; text-align: left;">WINNER</th><th style="padding: 12px; text-align: left;">RUNNER-UP</th></tr></thead><tbody><sc-for list="{{sel.results}}" as="r" hint-placeholder-count="8"><tr style="border-top: 1px solid rgba(255,255,255,.15);"><td style="padding: 12px;">{{r.c}}</td><td style="padding: 12px; font-weight: 700;">{{r.w}}</td><td style="padding: 12px;">{{r.r}}</td></tr></sc-for></tbody></table></div></div></sc-if>
          <sc-if value="{{sel.notes}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; max-width: 820px; color: #D5DBF2; line-height: 1.6;">{{sel.notes}}</p></sc-if>
        </div>
      </sc-if>
    </div>
  </section>

  <footer style="background: #221F1F; color: #C9CFE6;">
    <div style="max-width: 1320px; margin: 0 auto; padding: 32px 24px; display: flex; flex-wrap: wrap; gap: 12px 28px; font-size: 14px; align-items: center;">
      <img src="assets/logo-white.png" alt="Chiripal Squash Excellence" style="height: 40px; width: auto;">
      <a href="index.html" style="color: #C9CFE6;">Home</a>
      <a href="champions.html" style="color: #C9CFE6;">Champions</a>
      <a href="clinics.html" style="color: #C9CFE6;">Clinics &amp; Camps</a>
      <a href="mailto:siddharth.patil@chiripalgroup.com" style="color: #C9CFE6;">siddharth.patil@chiripalgroup.com</a>
      <a href="tel:+918879466939" style="color: #C9CFE6;">+91 88794 66939</a>
      <a href="https://www.instagram.com/squashexcellenceprogramme/" target="_blank" rel="noopener" style="color: #C9CFE6;">Instagram</a>
      <span style="margin-left: auto;">© 2026 Chiripal Group</span>
    </div>
  </footer>
</div>
</script>

<script>
(function(){
var TPL=document.getElementById('tpl').textContent, root=document.getElementById('root'), comp=new Component({}), H=[];
function get(c,p){p=p.trim();if(p==='true')return true;if(p==='false')return false;return p.split('.').reduce(function(o,k){return o==null?undefined:o[k]},c)}
function esc(v){return v==null?'':String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function proc(t,c){
 t=t.replace(/<sc-for\s+list="\{\{\s*([\w.]+)\s*\}\}"\s+as="(\w+)"[^>]*>([\s\S]*?)<\/sc-for>/g,function(m,l,as,b){return (get(c,l)||[]).map(function(it,i){var n=Object.assign({},c);n[as]=it;n.$index=i;return proc(b,n)}).join('')});
 var re=/<sc-if\s+value="\{\{\s*([\w.]+)\s*\}\}"[^>]*>((?:(?!<sc-if)[\s\S])*?)<\/sc-if>/g; while(re.test(t)){re.lastIndex=0; t=t.replace(re,function(m,v,b){return get(c,v)?b:''});}
 t=t.replace(/onClick="\{\{\s*([\w.]+)\s*\}\}"/gi,function(m,p){H.push(get(c,p));return 'data-h="'+(H.length-1)+'"'});
 return t.replace(/\{\{\s*([\w.$]+)\s*\}\}/g,function(m,p){return esc(get(c,p))});
}
window.__render=function(){
 var keep={};root.querySelectorAll('input[id],select[id]').forEach(function(e){keep[e.id]=e.type==='checkbox'?e.checked:e.value});
 H=[];root.innerHTML=proc(TPL,comp.renderVals());
 root.querySelectorAll('input[id],select[id]').forEach(function(e){if(e.id in keep){if(e.type==='checkbox')e.checked=keep[e.id];else e.value=keep[e.id]}});
 root.querySelectorAll('[data-h]').forEach(function(e){var f=H[+e.getAttribute('data-h')];if(f)e.addEventListener('click',function(ev){f(ev)})});
};
__render();
})();
</script>

    var ctBase = 'min-height: 44px; padding: 0 16px; border: 1px solid #B9C1DA; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;';

        style: ctBase + (on ? 'background: #14215C; color: #FFFFFF; border-color: #14215C;' : 'background: #FFFFFF; color: #14215C;') };
    });
    var cBase = 'min-height: 44px; padding: 0 14px; border: 1px solid #B9C1DA; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;';

    return {

      menuIcon: this.state.menuOpen ? 'M5 5l12 12M17 5L5 17' : 'M3 6h16M3 11h16M3 16h16',

<script>
(function(){
var TPL=document.getElementById('tpl').textContent, root=document.getElementById('root'), comp=new Component({}), H=[];
function get(c,p){p=p.trim();if(p==='true')return true;if(p==='false')return false;return p.split('.').reduce(function(o,k){return o==null?undefined:o[k]},c)}
function esc(v){return v==null?'':String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function proc(t,c){
 t=t.replace(/<sc-for\s+list="\{\{\s*([\w.]+)\s*\}\}"\s+as="(\w+)"[^>]*>([\s\S]*?)<\/sc-for>/g,function(m,l,as,b){return (get(c,l)||[]).map(function(it,i){var n=Object.assign({},c);n[as]=it;n.$index=i;return proc(b,n)}).join('')});
 var re=/<sc-if\s+value="\{\{\s*([\w.]+)\s*\}\}"[^>]*>((?:(?!<sc-if)[\s\S])*?)<\/sc-if>/g; while(re.test(t)){re.lastIndex=0; t=t.replace(re,function(m,v,b){return get(c,v)?b:''});}
 t=t.replace(/onClick="\{\{\s*([\w.]+)\s*\}\}"/gi,function(m,p){H.push(get(c,p));return 'data-h="'+(H.length-1)+'"'});
 return t.replace(/\{\{\s*([\w.$]+)\s*\}\}/g,function(m,p){return esc(get(c,p))});
}
window.__render=function(){
 var keep={};root.querySelectorAll('input[id],select[id]').forEach(function(e){keep[e.id]=e.type==='checkbox'?e.checked:e.value});
 H=[];root.innerHTML=proc(TPL,comp.renderVals());
 root.querySelectorAll('input[id],select[id]').forEach(function(e){if(e.id in keep){if(e.type==='checkbox')e.checked=keep[e.id];else e.value=keep[e.id]}});
 root.querySelectorAll('[data-h]').forEach(function(e){var f=H[+e.getAttribute('data-h')];if(f)e.addEventListener('click',function(ev){f(ev)})});
};
__render();
})();
</script>

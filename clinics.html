    <nav style="max-width: 1320px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: center; justify-content: space-between;">

  <section class="hero-bg" style="background-color: #0E1748; color: #FFFFFF;">

              <span style="color: #4A4F63; font-size: 14px;">Coach: [GUEST COACH] · [₹ FEE]</span>
            </div>

          <div style="aspect-ratio: 1 / 1; overflow: hidden; background: #1A2A70;"><img src="assets/camps/andrew-group.jpg" alt="International Camp squad with coaches" style="width: 100%; height: 100%; object-fit: cover; display: block;"></div>

  <!-- clinic gallery -->
  <section style="background: #F2F4FA;">

      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px;">
        <div style="border-top: 4px solid #143CAA; background: #FFFFFF; padding: 20px; display: flex; flex-direction: column; gap: 4px;"><span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 48px; line-height: 1; color: #14215C;">6</span><span style="font-size: 13px; font-weight: 700; letter-spacing: .1em; color: #4A4F63;">CITIES</span></div>

        <div style="border-top: 4px solid #143CAA; background: #FFFFFF; padding: 20px; display: flex; flex-direction: column; gap: 4px;"><span style="font-family: 'Barlow Condensed', sans-serif; font-style: italic; font-weight: 800; font-size: 48px; line-height: 1; color: #14215C;">151</span><span style="font-size: 13px; font-weight: 700; letter-spacing: .1em; color: #4A4F63;">PLAYERS REACHED</span></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px;">
        <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px;"><div style="aspect-ratio: 1 / 1; overflow: hidden; background: #1A2A70;"><img src="assets/camps/clinic-agsra-group.jpg" alt="Rajkot clinic participants with the AGSRA and Chiripal banner" style="width: 100%; height: 100%; object-fit: cover; display: block; object-position: center 70%;"></div><figcaption style="font-size: 14px; color: #4A4F63;">Rajkot clinic</figcaption></figure>
        <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px;"><div style="aspect-ratio: 1 / 1; overflow: hidden; background: #1A2A70;"><img src="assets/camps/clinic-lunges.jpg" alt="Juniors doing lunge footwork drills at the Ahmedabad clinic" style="width: 100%; height: 100%; object-fit: cover; display: block;"></div><figcaption style="font-size: 14px; color: #4A4F63;">Ahmedabad clinic</figcaption></figure>

  <footer style="background: #221F1F; color: #C9CFE6;">

</div>
</script>

<script>
class DCLogic{constructor(p){this.props=p||{};this.state={}}setState(s){Object.assign(this.state,s);__render()}forceUpdate(){__render()}}
</script>
<script>

class Component extends DCLogic {
  constructor(p) { super(p); this.state = { menuOpen: false, sel: 0, done: false }; }
  renderVals() {
    var self = this;
    var list = [
      { city: 'Rajkot', when: 'Late Nov 2026 · before the Heritage Squash Open', venue: '[VENUE]', seats: '[N] SEATS LEFT' },
      { city: 'Ahmedabad', when: 'Late Nov 2026 · [DATES]', venue: 'Sports Club, Ahmedabad', seats: '[N] SEATS LEFT' },
      { city: 'Surat', when: '[MONTH] · [DATES]', venue: '[VENUE]', seats: 'COMING SOON' },
      { city: 'Baroda', when: '[MONTH] · [DATES]', venue: '[PARTNER ACADEMY]', seats: 'COMING SOON' }
    ];
    var base = 'display: flex; gap: 16px; align-items: center; padding: 20px; background: #FFFFFF; cursor: pointer; font-family: inherit; color: inherit; min-height: 44px; border: 2px solid ';
    var clinics = list.map(function (c, i) {
      var on = self.state.sel === i;
      return Object.assign({}, c, {
        on: on ? 'true' : 'false',
        card: base + (on ? '#143CAA;' : '#DDE2F0;'),
        dot: 'width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; box-sizing: border-box; border: 2px solid #143CAA; background: ' + (on ? '#143CAA;' : '#FFFFFF;'),
        pick: function () { self.setState({ sel: i, done: false }); }
      });
    });
    return {
      navCls: this.state.menuOpen ? 'open' : '', menuExp: this.state.menuOpen ? 'true' : 'false', menuLabel: this.state.menuOpen ? 'Close menu' : 'Open menu',
      menuIcon: this.state.menuOpen ? 'M5 5l12 12M17 5L5 17' : 'M3 6h16M3 11h16M3 16h16',
      toggleMenu: function () { self.setState({ menuOpen: !self.state.menuOpen }); },
      clinics: clinics, sel: list[this.state.sel], done: this.state.done, notDone: !this.state.done,
      submit: function () { self.setState({ done: true }); },
      reset: function () { self.setState({ done: false }); }
    };
  }
}

</script>
<script>
(function(){
var TPL=document.getElementById('tpl').textContent, root=document.getElementById('root'), comp=new Component({}), H=[];
function get(c,p){p=p.trim();if(p==='true')return true;if(p==='false')return false;return p.split('.').reduce(function(o,k){return o==null?undefined:o[k]},c)}
function esc(v){return v==null?'':String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function proc(t,c){
 t=t.replace(/<sc-for\s+list="\{\{\s*([\w.]+)\s*\}\}"\s+as="(\w+)"[^>]*>([\s\S]*?)<\/sc-for>/g,function(m,l,as,b){return (get(c,l)||[]).map(function(it,i){var n=Object.assign({},c);n[as]=it;n.$index=i;return proc(b,n)}).join('')});
 var re=/<sc-if\s+value="\{\{\s*([\w.]+)\s*\}\}"[^>]*>((?:(?!<sc-if)[\s\S])*?)<\/sc-if>/g; while(re.test(t)){re.lastIndex=0; t=t.replace(re,function(m,v,b){return get(c,v)?b:''});}
